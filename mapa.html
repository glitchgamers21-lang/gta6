<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mapa de GTA 6: Leonida y Vice City interactivo | Leonida Hub</title>
  <meta name="description" content="Mapa interactivo de GTA VI con todas las regiones de Leonida: Vice City, Leonida Keys, Grassrivers, Port Gellhorn, Ambrosia y Mount Kalaga.">
  <meta name="theme-color" content="#0a0612">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23ff2e88'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='Impact,sans-serif'%3EVI%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script src="assets/js/config.js"></script>
  <script src="data/news.js"></script>
  <script src="data/videos.js"></script>
  <script src="data/contenido.js"></script>
  <script src="assets/js/main.js" defer></script>
</head>
<body>
  <header id="site-header"></header>
  <main>
    <section class="page-hero">
      <div class="container">
        <div class="breadcrumbs"><a href="index.html">Inicio</a> / Mapa</div>
        <span class="eyebrow">Interactivo</span>
        <h1>Mapa de <span class="grad-text">Leonida</span></h1>
        <p class="lead">Toca cada punto para descubrir las regiones del estado de Leonida. Mapa esquemático creado por fans.</p>
      </div>
    </section>
    <section class="section-sm" style="padding-top:0">
      <div class="container map-wrap">
        <div class="map-box">
          <svg id="leonida-map" viewBox="0 0 600 720" role="img" aria-label="Mapa esquemático de Leonida">
            <defs>
              <linearGradient id="land" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#2a1747"/>
                <stop offset="1" stop-color="#1b0f30"/>
              </linearGradient>
              <pattern id="water" width="24" height="24" patternUnits="userSpaceOnUse">
                <path d="M0 12 Q6 8 12 12 T24 12" fill="none" stroke="rgba(34,228,255,.08)" stroke-width="1.5"/>
              </pattern>
            </defs>
            <rect width="600" height="720" fill="url(#water)"/>
            <!-- Tierra firme -->
            <path class="map-region" fill="url(#land)" stroke="#ff2e88" stroke-width="2.5" stroke-linejoin="round"
              d="M30 130 Q90 95 180 105 Q260 112 330 100 Q410 80 470 110 Q500 150 492 210 Q505 290 525 370 Q548 450 552 520 Q548 575 505 600 Q462 610 430 575 Q400 530 372 470 Q342 410 310 345 Q288 290 262 248 Q230 222 170 215 Q105 210 60 195 Q25 170 30 130 Z"/>
            <!-- Lago interior -->
            <ellipse cx="420" cy="345" rx="34" ry="26" fill="#0f2a44" stroke="rgba(34,228,255,.4)" stroke-width="1.5"/>
            <!-- Zona de humedales -->
            <path d="M360 420 Q400 400 450 420 Q490 450 480 520 Q440 560 400 520 Q370 480 360 420 Z" fill="rgba(61,255,168,.12)" stroke="rgba(61,255,168,.35)" stroke-dasharray="4 4"/>
            <!-- Ciudad -->
            <path d="M500 450 Q540 455 548 500 Q545 545 510 560 Q490 520 500 450 Z" fill="rgba(255,46,136,.25)" stroke="rgba(255,46,136,.6)"/>
            <!-- Bosque norte -->
            <path d="M370 110 Q430 95 470 120 Q480 170 450 190 Q400 195 375 160 Z" fill="rgba(139,61,255,.22)" stroke="rgba(139,61,255,.5)" stroke-dasharray="4 4"/>
            <!-- Cayos -->
            <g fill="url(#land)" stroke="#22e4ff" stroke-width="1.5">
              <ellipse cx="480" cy="622" rx="16" ry="7" transform="rotate(-25 480 622)"/>
              <ellipse cx="450" cy="640" rx="18" ry="7" transform="rotate(-18 450 640)"/>
              <ellipse cx="415" cy="655" rx="20" ry="7" transform="rotate(-10 415 655)"/>
              <ellipse cx="375" cy="664" rx="18" ry="6" transform="rotate(-4 375 664)"/>
              <ellipse cx="338" cy="668" rx="15" ry="6"/>
              <ellipse cx="305" cy="670" rx="12" ry="5"/>
            </g>
            <path d="M494 612 L300 672" stroke="rgba(34,228,255,.4)" stroke-width="1.5" stroke-dasharray="3 5" fill="none"/>
            <!-- Rosa de los vientos -->
            <g transform="translate(70 600)" opacity=".7">
              <circle r="34" fill="none" stroke="rgba(255,255,255,.2)"/>
              <path d="M0 -30 L7 0 L0 30 L-7 0 Z" fill="#ff2e88"/>
              <text y="-40" text-anchor="middle" fill="#fff" font-size="14" font-family="Anton">N</text>
            </g>
            <g id="map-pins"></g>
          </svg>
        </div>
        <aside class="region-info">
          <div id="region-detail"></div>
          <div class="region-list" id="region-list"></div>
        </aside>
      </div>
      <div class="container"><div class="ad-slot" data-ad="horizontal"></div></div>
    </section>
  </main>
  <footer id="site-footer"></footer>
</body>
</html>
