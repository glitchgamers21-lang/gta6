# Actualiza noticias y videos cada 3 horas y publica el sitio en GitHub Pages.
name: Actualizar y publicar

on:
  schedule:
    - cron: "15 */3 * * *"   # cada 3 horas (hora UTC)
  push:
    branches: [main]
  workflow_dispatch:          # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Descargar noticias y videos
        env:
          YT_CHANNEL_ID: ${{ secrets.YT_CHANNEL_ID }}
        run: node scripts/update-news.mjs

      - name: Guardar cambios en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Actualización automática de noticias"
            git push
          fi

      - name: Actualizar fecha del sitemap
        run: sed -i "s#<lastmod>[^<]*</lastmod>#<lastmod>$(date -u +%Y-%m-%d)</lastmod>#g" sitemap.xml

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
